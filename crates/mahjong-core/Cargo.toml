[package]
name = "mahjong-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic Taiwanese 16-tile Mahjong rules, yaku calculator & bot engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
