[package]
name = "mahjong-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic Taiwanese 16-tile Mahjong rules, yaku calculator & bot engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 密碼學一律採用可信賴的現成函式庫（dalek / RustCrypto / rust-random），見 docs/04-host-anticheat-mental-poker.md §4.2
sha2 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "digest"] }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
